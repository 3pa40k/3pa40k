<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Первый.Южэжэджэдэж</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: transparent;
            overflow: hidden;
        }

        .money-display {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #00ff00;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(0, 255, 0, 0.3);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
            z-index: 1000;
        }

        .money-icon {
            color: #ffd700;
            margin-right: 8px;
            font-size: 20px;
        }

        .money-amount {
            display: inline-block;
            min-width: 80px;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="money-display">
        <span class="money-icon">$</span>
        <span class="money-amount" id="moneyAmount">25,000</span>
    </div>

    <script>
        // Инициализация денег игрока (пока без серверной логики)
        let playerMoney = 25000;

        // Функция для форматирования денег с разделителями
        function formatMoney(amount) {
            return amount.toLocaleString('ru-RU');
        }

        // Функция для обновления отображения денег
        function updateMoneyDisplay() {
            const moneyElement = document.getElementById('moneyAmount');
            moneyElement.textContent = formatMoney(playerMoney);
        }

        // Функция для установки количества денег (будет использоваться при интеграции с сервером)
        function setPlayerMoney(amount) {
            playerMoney = amount;
            updateMoneyDisplay();
        }

        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            updateMoneyDisplay();
        });

        // Функции для ALTV интеграции (будут использоваться позже)
        if (typeof alt !== 'undefined') {
            // Слушатель событий от сервера для обновления денег
            alt.on('updateMoney', (amount) => {
                setPlayerMoney(amount);
            });
        }

        // Демонстрационная функция для тестирования (можно удалить позже)
        function testMoneyUpdate() {
            setPlayerMoney(Math.floor(Math.random() * 1000000));
        }

        // Для демонстрации: обновление денег каждые 5 секунд (удалить при интеграции с сервером)
        // setInterval(testMoneyUpdate, 5000);
    </script>
</body>
</html>
